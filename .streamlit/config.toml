[browser]
gatherUsageStats = false

[theme]
primaryColor = "#FF6B6B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[server]
enableStaticServing = false
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 20

[runner]
fastReruns = true
